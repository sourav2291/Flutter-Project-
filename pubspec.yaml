
name: my_first_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^10.3.2
  image_picker: ^1.2.0
  http: ^1.2.2
  shared_preferences: ^2.5.3
  intl: ^0.20.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
  flutter_file_dialog: ^3.0.2
  dio: ^5.9.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Madathilogo.png
    - assets/seal.jpeg
    - assets/signature.jpeg
    - assets/pending.png
    - assets/verify.png
    - assets/approved.png
    - assets/rejected.png
    - assets/Delivery in Motion.gif
    - assets/pending animation.gif

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Madathilogo.png"
  min_sdk_android: 21
